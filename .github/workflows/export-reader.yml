name: Native export reader

on:
  pull_request:
    paths:
      - scripts/read-export.py
      - scripts/test_read_export.py
      - .github/workflows/export-reader.yml
  push:
    branches: [main]
    paths:
      - scripts/read-export.py
      - scripts/test_read_export.py
      - .github/workflows/export-reader.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-reader-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reader:
    name: Python export reader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: macos-15-intel
            python: python3
          - os: windows-2022
            python: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record exact source and runtime
        run: |
          git rev-parse HEAD
          git ls-tree HEAD -- scripts/read-export.py scripts/test_read_export.py .github/workflows/export-reader.yml
          ${{ matrix.python }} -VV
      - name: Verify export reader boundaries
        run: ${{ matrix.python }} -m unittest discover -s scripts -p 'test_read_export.py'
