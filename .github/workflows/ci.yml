name: ci

# Every PR runs the Linux gate (lint, vulncheck, race tests, build, repro, fuzz, contract, e2e).
# push is limited to main so a PR branch is not tested twice for the same commit. The slow
# macOS and Windows matrix (job test-cross) runs on main pushes, nightly and on demand only.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (or per ref for push/schedule/dispatch). Only superseded PR runs are cancelled,
  # so back-to-back main pushes each keep their cross-OS run.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: vet, gofmt, golangci-lint, govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check workflow action pins
        run: scripts/check-action-pins.sh
      - name: Repository hygiene (fixture PII scan QA-043, migration static check QA-037)
        run: scripts/check-hygiene.sh
      - name: Dependency licences against the approved list (ARC-024)
        run: scripts/licenses.sh --check
      - name: Secret scan (ARC-023, SEC-027)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 dir . --no-banner --redact --verbose
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          verify: false # config verify fetches a schema over the network; lint itself is deterministic
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: test with race detector
        # The race suite of internal/service takes about 8 min on 4 vCPUs; Go's 10m per-package default leaves too little room.
        run: go test -race -count=1 -timeout=20m ./...

  test-cross:
    # Not run on pull requests (macOS race ~8 min, Windows slow). Runs on main pushes, nightly, manual dispatch.
    if: github.event_name != 'pull_request'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS Intel's SQLite-heavy race suite exceeded Go's 10m/package default.
    # Retain every test and race instrumentation; bound the slower runner explicitly.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: test with race detector (macOS Intel, bounded parallelism)
        if: runner.os == 'macOS'
        # Keep the complete race suite and every regression. The longer Go per-package
        # timeout and limited concurrent packages accommodate SQLite on this runner.
        run: go test -race -count=1 -p 2 -timeout=25m ./...
      - name: test
        if: runner.os == 'Windows'
        # The race detector needs cgo, which the Windows runner does not provide by default.
        run: go test -count=1 ./...

  long-props:
    # QA-001 long run: seeded ledger-invariant sequences. Nightly and manual only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: QA-001 long property run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 1,000 sequences of 50 operations (release size 100,000 pending DEC-023)
        env:
          CIRCULA_QA001_SEQUENCES: "1000"
          CIRCULA_QA001_STEPS: "50"
          CIRCULA_QA001_FAILDIR: qa001-failures
        run: go test -count=1 -timeout=25m -run '^TestQA001LongRun$' ./internal/service
      - name: keep failing seeds
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa001-failures
          path: internal/service/qa001-failures
          if-no-files-found: ignore

  build:
    name: build release targets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: cross-build all OPS-003 targets from this commit
        run: VERSION=ci-${GITHUB_SHA::12} OUT=bin/ci-dist scripts/package-release.sh
      - name: upload packaged artifacts for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-dist
          path: bin/ci-dist
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: reproducible build (two builds, same sha256)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build twice (different directory and cache) and compare
        run: scripts/check-reproducible.sh
      - name: deploy smoke (binary under the systemd unit's settings, minus systemd)
        run: scripts/smoke-deploy.sh

  fuzz:
    name: fuzz smoke (RB-017)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: seed corpora of every fuzz target (also part of go test ./...)
        run: go test -count=1 -run '^Fuzz' ./internal/...
      - name: fuzz amount parser for 10s
        run: go test -run '^$' -fuzz '^FuzzParseAmount$' -fuzztime 10s ./internal/domain
      - name: fuzz strict JSON decoder for 10s
        run: go test -run '^$' -fuzz '^FuzzStrictUnmarshal$' -fuzztime 10s ./internal/api

  contract:
    name: API contract and load smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: contract (JSON API against docs/api/openapi.yaml)
        run: make contract
      - name: load smoke (small, QA-008 and QA-040 evidence)
        # Short run: 4 workers, 20 members, 25 trades each. Full-size runs are manual (docs/qa/LOAD-TEST.md).
        env:
          CIRCULA_LOAD: "1"
          CIRCULA_LOAD_WORKERS: "4"
          CIRCULA_LOAD_MEMBERS: "20"
          CIRCULA_LOAD_TRADES: "25"
        run: go test -count=1 -v -run 'LoadConcurrentTrades|QA008' ./internal/service

  e2e:
    name: e2e (Playwright, axe, keyboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: install e2e dependencies and Chromium (CI only; versions pinned in e2e/package-lock.json)
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: make e2e
        run: make e2e
      - name: upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
