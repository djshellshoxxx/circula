name: ci

# Every PR runs the Linux gate (lint, vulncheck, race tests, build, repro, fuzz, contract, e2e).
# push is limited to main so a PR branch is not tested twice for the same commit. The slow
# macOS and Windows matrix runs on main, nightly, dispatch and opted-in PRs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (or per ref for push/schedule/dispatch). Superseded PR runs are cancelled.
  # Running main workflows continue; GitHub may replace an older pending run in the same group.
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: vet, gofmt, golangci-lint, govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check workflow action pins
        run: scripts/check-action-pins.sh
      - name: Repository hygiene (fixture PII scan QA-043, migration static check QA-037)
        run: scripts/check-hygiene.sh
      - name: Dependency licences against the approved list (ARC-024)
        run: scripts/licenses.sh --check
      - name: Secret scan (ARC-023, SEC-027)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 dir . --no-banner --redact --verbose
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Requirement traceability is current
        run: make traceability-check
      - name: Export reader and property-runner tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_read_export.py'
          python3 -m unittest discover -s scripts -p 'test_run_qa001.py'
          python3 -m unittest discover -s scripts -p 'test_check_thresholds.py'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          verify: false # config verify fetches a schema over the network; lint itself is deterministic
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: test with race detector
        env:
          CIRCULA_QA001_FAILDIR: ${{ runner.temp }}/qa001-failures
        run: go run ./scripts/traceability -record-results "$RUNNER_TEMP/traceability-results.json" -- -race -timeout 20m ./...
      - name: Match requirement citations to recorded test results
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/traceability-results.json" ]; then
            go run ./scripts/traceability -head "$(git rev-parse --short HEAD)" \
              -evidence "$RUNNER_TEMP/traceability-results.json" \
              -o "$RUNNER_TEMP/TRACEABILITY-results.md"
          fi
      - name: Upload test evidence and property failure fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/traceability-results.json
            ${{ runner.temp }}/TRACEABILITY-results.md
            ${{ runner.temp }}/qa001-failures
          if-no-files-found: warn
          retention-days: 14

  test-cross:
    # Native qualification is opt-in on PRs; ordinary PRs retain the Linux gate.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:cross-platform')
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS Intel's SQLite-heavy race suite exceeded Go's 10m/package default.
    # Retain every test and race instrumentation; bound the slower runner explicitly.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: test with race detector (macOS Intel, bounded parallelism)
        if: runner.os == 'macOS'
        # Keep the complete race suite and every regression. The longer Go per-package
        # timeout and limited concurrent packages accommodate SQLite on this runner.
        run: go test -race -count=1 -p 2 -timeout=25m ./...
      - name: test
        if: runner.os == 'Windows'
        # The race detector needs cgo, which the Windows runner does not provide by default.
        run: go test -count=1 ./...

  build:
    name: build release targets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-build all OPS-003 targets from this commit
        run: VERSION=ci-${GITHUB_SHA::12} OUT=bin/ci-dist scripts/package-release.sh
      - name: upload packaged artifacts for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-dist
          path: bin/ci-dist
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: reproducible build (two builds, same sha256)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build twice (different directory and cache) and compare
        run: scripts/check-reproducible.sh
      - name: deploy smoke (binary under the systemd unit's settings, minus systemd)
        run: scripts/smoke-deploy.sh

  fuzz:
    name: fuzz smoke (RB-017)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: seed corpora of every fuzz target (also part of go test ./...)
        run: go test -count=1 -run '^Fuzz' ./internal/...
      # Go 1.26.11's duration-based coordinator can report its own normal
      # deadline as a failure (golang/go#75804). Execution budgets avoid that
      # cancellation race without filtering errors or weakening assertions.
      # These exceed the 678,832 / 41,458 executions in run 44296161788.
      - name: fuzz amount parser for 1000000 executions
        run: go test -run '^$' -fuzz '^FuzzParseAmount$' -fuzztime 1000000x -timeout 3m ./internal/domain
      - name: fuzz strict JSON decoder for 100000 executions
        run: go test -run '^$' -fuzz '^FuzzStrictUnmarshal$' -fuzztime 100000x -timeout 3m ./internal/api
      - name: fuzz signed pagination cursors for 100000 executions
        run: go test -run '^$' -fuzz '^FuzzOpenCursor$' -fuzztime 100000x -timeout 3m ./internal/api
      - name: fuzz session keyset positions for 100000 executions
        run: go test -run '^$' -fuzz '^FuzzSessionPosition$' -fuzztime 100000x -timeout 3m ./internal/service
      - name: fuzz noncredential session selectors for 100000 executions
        run: go test -run '^$' -fuzz '^FuzzSessionSelector$' -fuzztime 100000x -timeout 3m ./internal/service

  contract:
    name: API contract and load smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: contract (JSON API against docs/api/openapi.yaml)
        run: make contract
      - name: load smoke (small, QA-008 and QA-040 evidence)
        # Short run: 4 workers, 20 members, 25 trades each. Full-size runs are manual (docs/qa/LOAD-TEST.md).
        env:
          CIRCULA_LOAD: "1"
          CIRCULA_LOAD_WORKERS: "4"
          CIRCULA_LOAD_MEMBERS: "20"
          CIRCULA_LOAD_TRADES: "25"
        run: go test -count=1 -v -run 'LoadConcurrentTrades|QA008' ./internal/service

  e2e:
    name: e2e (Playwright, axe, keyboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: install e2e dependencies and Chromium (CI only; versions pinned in e2e/package-lock.json)
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: make e2e
        run: make e2e
      - name: upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
