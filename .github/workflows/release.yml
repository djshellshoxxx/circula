name: release

# Runs only for version tags (v*). The publish job creates a published (not draft)
# GitHub release for the tag; nothing else publishes.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: check tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
      - name: check release notes exist (OPS-026)
        run: |
          if [ ! -s "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "docs/releases/${GITHUB_REF_NAME}.md is missing; write the release notes before tagging"
            exit 1
          fi
      - name: vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

  build:
    name: build release artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: package all targets
        run: VERSION="$GITHUB_REF_NAME" OUT=bin/dist scripts/package-release.sh
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: bin/dist
          if-no-files-found: error
          retention-days: 30

  publish:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: verify checksums before publishing
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
      - name: create release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --draft=false \
            --title "Circula $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
