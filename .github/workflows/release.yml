name: release

# Runs only for version tags (v*). The publish job creates a published (not draft)
# GitHub release for the tag; nothing else publishes. The tag's commit must be
# reachable from the default branch (SA2-19); also protect v* tags in the
# repository settings (docs/ops/runbook.md).
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the ancestry check below
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # release builds never restore a cache a CI run could have poisoned (SA-14)
      - name: tag commit must be on the default branch (SA2-19)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "commit $GITHUB_SHA (tag $GITHUB_REF_NAME) is not an ancestor of origin/${DEFAULT_BRANCH}; releases are cut only from reviewed default-branch history"
            exit 1
          fi
      - name: check tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
      - name: check release notes exist (OPS-026)
        run: |
          if [ ! -s "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "docs/releases/${GITHUB_REF_NAME}.md is missing; write the release notes before tagging"
            exit 1
          fi
      - name: vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: govulncheck
        # Pinned to an exact release; `go run mod@version` checks the module
        # against the public checksum database (sumdb), which is the hash pin
        # the toolchain supports. Keep in step with ci.yml and the Makefile.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  build:
    name: build release artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # release builds never restore a cache a CI run could have poisoned (SA-14)
      - name: package all targets
        run: VERSION="$GITHUB_REF_NAME" OUT=bin/dist scripts/package-release.sh
      - name: upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: bin/dist
          if-no-files-found: error
          retention-days: 30

  publish:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: verify checksums before publishing
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
      - name: create release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --draft=false \
            --title "Circula $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
