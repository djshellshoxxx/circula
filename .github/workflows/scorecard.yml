name: scorecard

# OpenSSF Scorecard supply-chain check (https://scorecard.dev). Results go to the Security tab as SARIF and,
# on the default branch, to the public Scorecard API (publish_results). Needs a public repository for
# publish_results; set it to false for a private one.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 3"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish results to the Scorecard API (OIDC)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
