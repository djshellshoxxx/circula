      tags: [Admin]
      summary: Current network policy (API-058)
      description: Administrator only. Returns the policy version and an ETag for PATCH.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
      responses:
        '200':
          description: Policy with ETag.
