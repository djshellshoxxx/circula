openapi: 3.1.0
info:
  title: Circula JSON API
  version: 1.0.0-draft
  summary: Versioned JSON API under /api/v1 for a credit-circle network.
  description: |
    Machine-readable description of the routes implemented in internal/api
    (branch claude/circula-build, as built 2026-10-21). Requirement IDs (API-nnn)
    refer to docs/specs/07-api-contract.md. Where the as-built behaviour differs
    from the spec, the operation description says "As built:" and spec 07 section 12
    lists the deviation.

    Conventions (all operations):
    - Bodies are application/json; charset=utf-8 (API-003). PATCH bodies are
      application/merge-patch+json (API-006). Unknown fields and duplicate keys are
      rejected with 400 invalid-body. Request bodies are limited to 64 KiB (API-037).
    - Money is a JSON string of canonical base-10 minor units (API-004). Timestamps are
      RFC 3339 UTC with milliseconds and Z (API-005).
    - Every response carries Cache-Control: no-store, X-Request-Id, X-Content-Type-Options
      and a restrictive Content-Security-Policy (API-039).
    - Errors are application/problem+json (RFC 9457) with the stable code catalogue
      (API-029..033, spec 7.2).
    - Lists use cursor pagination: limit (1..100, default 25) and opaque HMAC-signed
      cursor; envelope {data, next_cursor} (API-034/035).
    - Authentication is either a session cookie (browser) or a bearer API token
      (non-browser). Cookie-authenticated unsafe requests MUST send X-CSRF-Token, which
      is returned in the X-CSRF-Token response header of every cookie-authenticated
      response (API-014). Bearer requests are exempt from CSRF.
    - Credentials in the query string are refused with 400 credentials-in-query (API-012).
    - Network scope: network-scoped operations use the X-Network header (network id or
      slug) when the caller belongs to several networks; otherwise the single membership
      is used (OQ-API-02, as built). Operations marked noNet do not resolve a network.
    - Every operation requires authentication. No route is public (as built; OQ-API-06
      is resolved as members-only for GET /network).
  contact:
    name: Circula API maintainers
  license:
    name: See repository LICENSE
    identifier: UNLICENSED
servers:
  - url: /
    description: Deployment origin. Every path below already carries the /api/v1 prefix (API-002, API-073).
tags:
  - name: Network
  - name: Identity
  - name: Members
  - name: Accounts
  - name: Listings
  - name: Transactions
  - name: Disputes
  - name: Admin
  - name: Invitations
  - name: Exports
  - name: Tokens
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/v1/network:
    get:
      operationId: getNetwork
      tags: [Network]
      summary: Read the current network settings (API-040)
      description: Network name, decimals, currency name, join mode, dispute window and proposal expiry. As built, the caller must be authenticated (OQ-API-06 resolved as members-only). No ETag is emitted.
      security: &secSafe
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
      responses:
        '200':
          description: Network settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/network/announcements:
    get:
      operationId: listNetworkAnnouncements
      tags: [Network]
      summary: Member read of announcements (API-064) - not implemented
      description: As built, always 501 not-implemented. The service layer has no announcements.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotImplemented'}

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Identity]
      summary: Caller's person and memberships (API-041)
      description: |
        Returns the person id and the caller's memberships. noNet route.
        As built: the list contains the memberships visible to the credential across all
        networks in its scope, not only the current network (spec API-041 says "in this network"; see spec 07 section 12).
      security: *secSafe
      responses:
        '200':
          description: Person and memberships.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/me/password:
    post:
      operationId: changePassword
      tags: [Identity]
      summary: Change the caller's password (API-067a, AUTH-03, SEC-003)
      description: |
        Session cookie only (cookieOnly; a bearer token gets 403 forbidden). noNet. Verifies
        the current password, sets the new one and revokes every session of the person,
        including the caller's. API tokens stay valid. A wrong current password is 422
        validation-failed at /current_password, not 401. Five attempts per minute per person,
        then 429. Idempotency-Key is not used.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: Password changed; all sessions of the person revoked.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/members:
    get:
      operationId: listMembers
      tags: [Members]
      summary: Member directory (API-042)
      description: |
        Paginated directory of the caller's network. As built, every item has status "active"
        (the directory lists active members only).
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of directory entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/members/{id}:
    get:
      operationId: getMember
      tags: [Members]
      summary: Visible member detail (API-043)
      description: Not-visible or other-network members return 404 not-found (API-017).
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/accounts/me:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Caller's balance view (API-044)
      description: Balance, credit limit, reserved and available amounts, and derived direction (API-007). No ETag.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
      responses:
        '200':
          description: Balance view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/accounts/me/entries:
    get:
      operationId: listAccountEntries
      tags: [Accounts]
      summary: Caller's ledger lines, newest first (API-045)
      description: Ordered by ledger_seq descending. The cursor encodes the ledger_seq of the last line returned. A page may hold fewer than limit items with a non-null next_cursor when the server work cap is reached.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of ledger lines.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/me/membership/departure:
    post:
      operationId: departMember
      tags: [Members]
      summary: Start own departure (API-067)
      description: |
        Idempotency-Key required. Optional body {reason}. As built, departure is refused with
        409 blocked (blockers list) while the member has a disputed transaction or is the last
        active administrator. A non-zero balance is not itself a refusal; the response reports
        settlement "retained" or "settled". Ledger entries are never deleted.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: Departure recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartureResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /api/v1/listings:
    get:
      operationId: listListings
      tags: [Listings]
      summary: Browse listings (API-046)
      description: Filters kind, free-text q (max 200 characters) and member_id. Unknown query parameters are 400 invalid-query.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [offer, request]}
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 200}
        - name: member_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: One page of listings. No ETag is emitted on list items.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListingPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createListing
      tags: [Listings]
      summary: Create an offer or request (API-046)
      description: |
        Active member only. Response includes ETag for later PATCH.
        As built: Idempotency-Key is required (spec 046 says SHOULD). Title 1 to 120 characters.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateListingRequest'}
      responses:
        '201':
          description: Listing created.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Listing'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/listings/{id}:
    patch:
      operationId: patchListing
      tags: [Listings]
      summary: Update own listing (API-047)
      description: |
        Merge patch (RFC 7396) with If-Match (API-026/027). Owner only; another member's
        listing is 404 (API-017). price_minor null clears the price. Other fields reject null
        with 422. status is active, paused or archived. There is no GET for a single listing,
        so the current ETag comes from the create or patch response.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/PatchListingRequest'}
      responses:
        '200':
          description: Updated listing.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Listing'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: Caller's transactions (API-049)
      description: Only transactions the caller is party to. status is a comma-separated list. The accepted status is not a valid filter (as built, it is transient).
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Comma-separated statuses.
          schema: {type: string, example: 'proposed,completed'}
        - name: role
          in: query
          required: false
          schema: {type: string, enum: [payer, payee]}
      responses:
        '200':
          description: One page of transactions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: proposeTransaction
      tags: [Transactions]
      summary: Propose a trade (API-048)
      description: |
        Active member proposes. Creates a proposed transaction that expires per network policy.
        Refused with 422 insufficient-available-credit (payer side, LED-5) or amount-exceeds-policy,
        with no state change. Response is 201 with Location.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposeTransactionRequest'}
      responses:
        '201':
          description: Proposal created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/transactions/{id}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Transaction detail (API-049)
      description: Visible to a party, to a network administrator of the same network (any transaction, as built and per the spec 07 wording update), and to a dispute reviewer when a dispute exists on it. Others get 404.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Transaction with the events link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/transactions/{id}/events:
    get:
      operationId: listTransactionEvents
      tags: [Transactions]
      summary: Append-only status history (API-050)
      description: Paginated status history for a visible transaction. The cursor is an offset into the history, sealed by the server.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of status events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionEventPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/transactions/{id}/accept:
    post:
      operationId: acceptTransaction
      tags: [Transactions]
      summary: Accept a proposal (API-051)
      description: Counterparty only, from proposed. Posts both entries atomically. Returns the updated own account view (API-069). A limit failure leaves the status proposed and returns 422 insufficient-available-credit.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Trade completed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionAcceptResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransactionState'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /api/v1/transactions/{id}/decline:
    post:
      operationId: declineTransaction
      tags: [Transactions]
      summary: Decline a proposal (API-052)
      description: Counterparty only, from proposed. No entries are written.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransactionState'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/transactions/{id}/cancel:
    post:
      operationId: cancelTransaction
      tags: [Transactions]
      summary: Cancel own proposal (API-053)
      description: Proposer only, from proposed. Optional body {reason}. No entries are written. Completed trades are corrected by reversal (API-056).
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransactionState'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/disputes:
    get:
      operationId: listDisputes
      tags: [Disputes]
      summary: Disputes visible to the caller (API-054)
      description: Parties see their own disputes; reviewers and administrators see the network's disputes, per service visibility.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Comma-separated dispute statuses.
          schema: {type: string, example: 'open,under_review'}
      responses:
        '200':
          description: One page of disputes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DisputePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: openDispute
      tags: [Disputes]
      summary: Open a dispute on a completed trade (API-054)
      description: Party only, within the network dispute window. A second open dispute on the same transaction is 409 invalid-transaction-state. Category is one of not_delivered, quality, wrong_amount, unauthorised, other.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenDisputeRequest'}
      responses:
        '201':
          description: Dispute opened.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispute'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransactionState'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
