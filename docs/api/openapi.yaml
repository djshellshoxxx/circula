          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/admin/invitations:
    post:
      operationId: createInvitation
      tags: [Invitations]
      summary: Create an invitation (API-061)
      description: Administrator only. Token is returned once. ttl_seconds 0 (default 7 days) to 90 days.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInvitationRequest'}
      responses:
        '201':
          description: Invitation created; token shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [Invitations]
      summary: Redeem an invitation (API-061)
      description: Requires authentication (session or bearer) of the invitee. noNet. The token is in the path (never in the query, API-012). Returns the new membership.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathToken'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInvitationRequest'}
      responses:
        '201':
          description: Membership created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/admin/audit-events:
    get:
      operationId: listAuditEvents
      tags: [Admin]
      summary: Audit trail (API-062)
      description: Administrator only. Filters action, target_id, actor_id, from and to (RFC 3339). Access is itself audited (DAT-034). Only fields listed in 06 section 7.1 are returned.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: action, in: query, required: false, schema: {type: string}}
        - {name: target_id, in: query, required: false, schema: {type: string}}
        - {name: actor_id, in: query, required: false, schema: {type: string}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: One page of audit events, ordered by seq.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/admin/consistency-checks:
    post:
      operationId: runConsistencyCheck
      tags: [Admin]
      summary: Run ledger consistency checks (API-063)
      description: Administrator only. Records the run. As built, the result is held in process memory for 24 hours (max 200 results), so it does not survive a restart.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '201':
          description: Check result.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsistencyCheck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /api/v1/admin/consistency-checks/{id}:
    get:
      operationId: getConsistencyCheck
      tags: [Admin]
      summary: Read a consistency check result (API-063)
      description: Administrator only. Only results recorded by the same network in the last 24 hours are found; others are 404.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Check result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsistencyCheck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/admin/announcements:
    get:
      operationId: listAdminAnnouncements
      tags: [Admin]
      summary: Announcements, administrator read (API-064) - not implemented
      description: As built, always 501 not-implemented.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotImplemented'}
    post:
      operationId: createAnnouncement
      tags: [Admin]
      summary: Publish an announcement (API-064) - not implemented
      description: As built, always 501 not-implemented, before any body is read.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '501': {$ref: '#/components/responses/NotImplemented'}

  /api/v1/exports:
    post:
      operationId: createExport
      tags: [Exports]
      summary: Create an export (API-065)
      description: |
        Runs synchronously. The 201 response already has status complete, with a SHA-256 and the artefact
        URL. The artefact is a ZIP (application/zip) of CSV or JSON files. Artefacts live in memory for 24 hours.
        Limits as built: 5 live exports per person (429 rate-limited with Retry-After 3600), 50 in total and
        64 MiB (503 unavailable with Retry-After 60). Idempotency-Key is optional.
        As built: no queued, running or failed states are exposed.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateExportRequest'}
      responses:
        '201':
          description: Export complete.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /api/v1/exports/{id}:
    get:
      operationId: getExport
      tags: [Exports]
      summary: Export job status (API-065)
      description: Only the person and network that created the export. Expired or foreign exports are 404.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Export status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/exports/{id}/artefact:
    get:
      operationId: getExportArtefact
      tags: [Exports]
      summary: Download an export artefact (API-065, DAT-040)
      description: Served only after the stored bytes match the recorded SHA-256; otherwise 500 internal-error. Returned as an attachment with X-Content-SHA256.
      security: *secSafe
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: ZIP archive.
          headers:
            Content-Disposition:
              description: attachment with filename circula-export-<scope>.zip
              schema: {type: string}
            X-Content-SHA256:
              description: Lowercase hex SHA-256 of the archive.
              schema: {type: string}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/tokens:
    get:
      operationId: listTokens
      tags: [Tokens]
      summary: Caller's API tokens (API-066)
      description: noNet. Requires read scope. Not paginated; at most 100 rows (API-036). Token values are never returned here.
      security: *secSafe
      responses:
        '200':
          description: Token metadata (next_cursor is always null).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createToken
      tags: [Tokens]
      summary: Create an API token (API-066, API-010)
      description: |
        Session cookie only (cookieOnly; bearer gets 403). noNet. The token value (prefix cir_) is shown once.
        Scopes read and write only; admin returns 501 not-implemented. Default and maximum expiry 365 days.
        Idempotency-Key is optional.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTokenRequest'}
      responses:
        '201':
          description: Token created; token value present once.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}

  /api/v1/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [Tokens]
      summary: Revoke an API token (API-066)
      description: noNet. Requires write scope. Revocation is immediate; the revoked token then fails with 401.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204': {description: Token revoked.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: circula_session
      description: |
        Session cookie issued by the HTML sign-in flow. As built the name is circula_session, or
        __Host-circula_session when served over TLS (both are accepted on read). HttpOnly, SameSite=Lax (API-008).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: cir_ token
      description: "Personal API token presented as Authorization: Bearer (API-009). Tokens start with cir_."
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on cookie-authenticated POST, PUT, PATCH and DELETE (API-014). Value from the X-CSRF-Token response header. Not used for bearer requests.

  parameters:
    XNetwork:
      name: X-Network
      in: header
      required: false
      description: Network id or slug. Required only when the caller belongs to several networks (400 network-required otherwise). An unknown or foreign network is 404.
      schema: {type: string}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        1 to 255 printable ASCII characters (API-021). Same key and same canonical body within 24 hours
        replays the original response with Idempotent-Replayed: true (API-022). Same key with a different
        body is 422 idempotency-key-reused (API-023). A concurrent duplicate is 409 idempotency-request-in-progress with Retry-After (API-024).
        Failed requests are not cached, so the key stays reusable (OQ-API-04 as built). Missing key is 400 idempotency-key-required.
        Malformed key is 400 invalid-header.
      schema: {type: string, minLength: 1, maxLength: 255}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on this operation. Same rules as the required header when sent.
      schema: {type: string, minLength: 1, maxLength: 255}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the current version (API-026). Missing header is 428 precondition-required; mismatch is 412 precondition-failed with no change (API-027).
      schema: {type: string}
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Optional on this operation. When sent, must match the current ETag or the request fails with 412. As built, not required (spec 026 says MUST; see spec 07 section 12).
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, integer 1 to 100 (API-034).
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from next_cursor. Bound to route, network, caller and filters; reuse with other filters is 400 invalid-cursor (API-035).
      schema: {type: string}
    PathId:
      name: id
      in: path
      required: true
      description: Resource identifier (UUIDv7 for domain records; see API-005). Foreign or unknown ids are 404.
      schema: {type: string}
    PathToken:
      name: token
      in: path
      required: true
      description: Invitation token shown once at creation.
      schema: {type: string}
    PathRole:
      name: role
      in: path
      required: true
      schema: {type: string, enum: [admin, reviewer]}

  headers:
    ETag:
      description: Strong ETag of the resource version. Send back in If-Match on the next update.
      schema: {type: string}
    Location:
      description: URL of the created resource (path below /api/v1).
      schema: {type: string}
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 0}
    WWWAuthenticate:
      description: Bearer realm="circula" on every 401.
      schema: {type: string}

  responses:
    BadRequest:
      description: invalid-body, invalid-query, invalid-cursor, invalid-header, idempotency-key-required, credentials-in-query, network-required, or not-found-style malformed input.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: unauthenticated. Missing, invalid or revoked credentials.
      headers:
        WWW-Authenticate: {$ref: '#/components/headers/WWWAuthenticate'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: forbidden (role, state or session-only rule) or csrf-invalid (missing or wrong X-CSRF-Token on a cookie request).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: not-found. Unknown, foreign-network, not-visible, or expired resource (API-017 gives the same body in all cases).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: conflict or blocked (with blockers) or idempotency-request-in-progress (Retry-After 1).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Blocked:
      description: blocked. Departure or removal refused; blockers lists the reasons (for example disputed transaction ids, last active administrator). Spec 7.2 code member-has-open-balance is not emitted as built.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InvalidTransactionState:
      description: invalid-transaction-state. The action is not allowed in the current state. current_status carries the current status (API-028).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: precondition-failed. If-Match does not match the current ETag. No change made.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: precondition-required. If-Match is required for this operation.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: payload-too-large. Body above 64 KiB (API-037).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: unsupported-media-type. Body without application/json (or application/merge-patch+json for PATCH) and charset utf-8.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: validation-failed (errors[] with pointers), insufficient-available-credit, amount-exceeds-policy, counterparty-not-active, or idempotency-key-reused.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: rate-limited. Per-principal (600 per minute default) or per-IP (1200 per minute default) fixed window, or a per-person cap. Retry-After is set.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotImplemented:
      description: not-implemented. Feature not provided by the service layer as built (announcements, admin token scope, dispute adjustment outcome).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: unavailable. Storage busy or export store full. Retry-After is set.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: internal-error. Opaque; use request_id for support (API-032).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with the extension members of API-030. type is urn:circula:problem:<code>.
      required: [type, title, status, detail, instance, code, request_id]
      additionalProperties: false
      properties:
        type: {type: string, pattern: '^urn:circula:problem:[a-z-]+$', example: 'urn:circula:problem:validation-failed'}
        title: {type: string, description: Short English summary that does not vary with detail.}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, description: Request path with credential-like values redacted.}
        code: {$ref: '#/components/schemas/ErrorCode'}
        request_id: {type: string, description: Same value as the X-Request-Id response header.}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldProblem'}
        blockers:
          type: array
          items: {type: string}
        current_status:
          type: string
          description: Current transaction status for invalid-transaction-state (API-028).
    FieldProblem:
      type: object
      required: [pointer, code, detail]
      additionalProperties: false
      properties:
        pointer: {type: string, description: "RFC 6901 pointer into the request body, for example /amount_minor."}
        code: {type: string, description: "Field-level code. Open set as built: invalid, invalid-enum, invalid-amount, invalid-type, invalid-timestamp, out-of-range, required, incorrect."}
        detail: {type: string}
    ErrorCode:
      type: string
      description: |
        Stable code. Spec 7.2 catalogue plus codes emitted as built: method-not-allowed (405),
        not-implemented (501), network-required (400), blocked (409), conflict (409).
        Clients MUST treat unknown codes as the generic error for their status (7.2).
      enum:
        - invalid-body
        - invalid-query
        - invalid-cursor
        - invalid-header
        - credentials-in-query
        - idempotency-key-required
        - network-required
        - validation-failed
        - insufficient-available-credit
        - amount-exceeds-policy
        - counterparty-not-active
        - idempotency-key-reused
        - unauthenticated
        - forbidden
        - csrf-invalid
        - not-found
        - invalid-transaction-state
        - idempotency-request-in-progress
        - blocked
        - conflict
        - precondition-failed
        - precondition-required
        - payload-too-large
        - unsupported-media-type
        - rate-limited
        - method-not-allowed
        - not-implemented
        - internal-error
        - unavailable
        - member-has-open-balance

    Money:
      type: string
      description: Canonical base-10 integer of minor units, no sign, no leading zeros (API-004). Fits a signed 64-bit integer.
      pattern: '^(0|[1-9][0-9]{0,18})$'
      example: '1250'
    MoneyPositive:
      type: string
      description: Like Money but greater than zero.
      pattern: '^[1-9][0-9]{0,18}$'
      example: '1250'
    SignedMoney:
      type: string
      description: Signed canonical integer of minor units; negative for debits from the caller's view (API-045).
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC with milliseconds and Z (API-005).
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
    Id:
      type: string
      description: Identifier. UUIDv7 for domain records (API-005); export and consistency-run identifiers are generated as UUIDv4 as built.
    NetworkStatus: {type: string, enum: [setup, active, closed]}
    JoinMode: {type: string, enum: [invite, approval, open]}
    DepartureRule: {type: string, enum: [retain, settle-to-zero]}
    MemberStatus: {type: string, enum: [pending, active, suspended, departed]}
    Role: {type: string, enum: [admin, reviewer]}
    AccountState: {type: string, enum: [active, frozen, closed]}
    Direction:
      type: string
      description: Derived from balance (API-007).
      enum: [in_credit, in_debt, zero]
    TxStatus:
      type: string
      enum: [proposed, accepted, completed, declined, cancelled, expired, disputed, reversed]
    TxKind: {type: string, enum: [trade, reversal, adjustment, grant]}
    ListingKind: {type: string, enum: [offer, request]}
    ListingStatus: {type: string, enum: [active, paused, archived]}
    DisputeStatus: {type: string, enum: [open, under_review, posting_pending, resolved, withdrawn]}
    DisputeOutcome: {type: string, enum: [dismissed, upheld, partially_upheld]}
    DisputeCategory: {type: string, enum: [not_delivered, quality, wrong_amount, unauthorised, other]}
    ActorType:
      type: string
      description: Audit actor type as shown on the API (member, system) for status events; audit events use the wider set below.
      enum: [member, system, network_administrator, dispute_reviewer, platform_operator, person]

    Network:
      type: object
      required: [id, name, slug, status, currency_name, decimals, join_mode, dispute_window_days, proposal_expiry_days, max_tx_amount_minor, default_credit_limit_minor, policy_version]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/NetworkStatus'}
        currency_name: {type: string}
        decimals: {type: integer, minimum: 0}
        join_mode: {$ref: '#/components/schemas/JoinMode'}
        dispute_window_days: {type: integer, minimum: 0}
        proposal_expiry_days: {type: integer, minimum: 0}
        max_tx_amount_minor: {$ref: '#/components/schemas/Money'}
        default_credit_limit_minor: {$ref: '#/components/schemas/Money'}
        policy_version: {type: integer, minimum: 0}
    Membership:
      type: object
      required: [network_id, member_id, display_name, status, roles]
      additionalProperties: false
      properties:
        network_id: {$ref: '#/components/schemas/Id'}
        member_id: {$ref: '#/components/schemas/Id'}
        display_name: {type: string}
        status: {$ref: '#/components/schemas/MemberStatus'}
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
    Me:
      type: object
      required: [person_id, memberships]
      additionalProperties: false
      properties:
        person_id: {$ref: '#/components/schemas/Id'}
        memberships:
          type: array
          description: As built, memberships across the networks in the credential's scope (see spec 07 section 12).
          items: {$ref: '#/components/schemas/Membership'}
    Member:
      type: object
      required: [id, display_name, status]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Id'}
        display_name: {type: string}
        status: {$ref: '#/components/schemas/MemberStatus'}
    AdminMember:
      type: object
      required: [id, display_name, status, roles, join_method, default_flag, joined_at]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Id'}
        display_name: {type: string}
        status: {$ref: '#/components/schemas/MemberStatus'}
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        join_method: {type: string}
        default_flag: {type: boolean}
        joined_at: {$ref: '#/components/schemas/Timestamp'}
        departed_at:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
    Account:
      type: object
      required: [member_id, account_state, balance_minor, credit_limit_minor, reserved_minor, available_minor, awaiting_from_others_minor, direction, decimals, ledger_seq]
      additionalProperties: false
      properties:
        member_id: {$ref: '#/components/schemas/Id'}
        account_state: {$ref: '#/components/schemas/AccountState'}
        balance_minor: {$ref: '#/components/schemas/SignedMoney'}
        credit_limit_minor: {$ref: '#/components/schemas/Money'}
        reserved_minor: {$ref: '#/components/schemas/Money'}
        available_minor: {$ref: '#/components/schemas/SignedMoney'}
        awaiting_from_others_minor: {$ref: '#/components/schemas/Money'}
        direction: {$ref: '#/components/schemas/Direction'}
        decimals: {type: integer, minimum: 0}
        ledger_seq: {type: integer, format: int64, minimum: 0}
    Entry:
      type: object
      required: [transaction_id, kind, status, ledger_seq, amount_minor, counterparty_member_id, counterparty_display_name, posted_at]
      additionalProperties: false
      properties:
        transaction_id: {$ref: '#/components/schemas/Id'}
        kind: {$ref: '#/components/schemas/TxKind'}
        status: {$ref: '#/components/schemas/TxStatus'}
        ledger_seq: {type: integer, format: int64, minimum: 0}
        amount_minor: {$ref: '#/components/schemas/SignedMoney'}
        counterparty_member_id:
          oneOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]
        counterparty_display_name:
          oneOf: [{type: string}, {type: 'null'}]
        posted_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
    Listing:
      type: object
      required: [id, member_id, kind, title, description, price_minor, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Id'}
        member_id: {$ref: '#/components/schemas/Id'}
        kind: {$ref: '#/components/schemas/ListingKind'}
        title: {type: string, maxLength: 120}
        description: {type: string}
        price_minor:
          oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
        status: {$ref: '#/components/schemas/ListingStatus'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    Transaction:
      type: object
      required: [id, kind, status, payer_member_id, payee_member_id, amount_minor, my_direction, listing_id, description, original_transaction_id, reversed_total_minor, proposed_at, expires_at, completed_at, posted_ledger_seq]
      additionalProperties: false
      properties: &txProps
        id: {$ref: '#/components/schemas/Id'}
        kind: {$ref: '#/components/schemas/TxKind'}
        status: {$ref: '#/components/schemas/TxStatus'}
        payer_member_id: {oneOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        payee_member_id: {oneOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        amount_minor: {$ref: '#/components/schemas/Money'}
        my_direction:
          oneOf:
            - {type: string, enum: [pay, receive]}
            - {type: 'null'}
          description: From the caller's view; null when the caller is not a party.
        listing_id: {oneOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        description: {type: string, maxLength: 500}
        reason:
          type: string
          description: Present only when non-empty (omitted otherwise).
        original_transaction_id: {oneOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        reversed_total_minor: {$ref: '#/components/schemas/Money'}
        proposed_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        completed_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        posted_ledger_seq:
          oneOf: [{type: integer, format: int64, minimum: 1}, {type: 'null'}]
    TransactionDetail:
      type: object
      description: Transaction plus the events link.
      required: [id, kind, status, payer_member_id, payee_member_id, amount_minor, my_direction, listing_id, description, original_transaction_id, reversed_total_minor, proposed_at, expires_at, completed_at, posted_ledger_seq, events_url]
      additionalProperties: false
      properties:
        <<: *txProps
        events_url: {type: string}
    TransactionAcceptResult:
      type: object
      description: Transaction plus the caller's account after posting.
      required: [id, kind, status, payer_member_id, payee_member_id, amount_minor, my_direction, listing_id, description, original_transaction_id, reversed_total_minor, proposed_at, expires_at, completed_at, posted_ledger_seq]
      additionalProperties: false
      properties:
        <<: *txProps
        account:
          description: Caller's account after posting (API-069). Omitted when the balance could not be read.
          $ref: '#/components/schemas/Account'
    TransactionEvent:
      type: object
      required: [from, to, actor_type, actor_id, occurred_at]
      additionalProperties: false
      properties:
        from:
          description: Empty string for the first event.
          oneOf: [{$ref: '#/components/schemas/TxStatus'}, {type: string, const: ''}]
        to: {$ref: '#/components/schemas/TxStatus'}
        actor_type: {type: string, enum: [member, system]}
        actor_id: {type: string, description: Empty for system events.}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
    Dispute:
      type: object
      required: [id, transaction_id, opened_by, category, statement, status, outcome, reversal_amount_minor, reviewer_id, reason, opened_at, decided_at]
      additionalProperties: false
      properties: &disputeProps
        id: {$ref: '#/components/schemas/Id'}
        transaction_id: {$ref: '#/components/schemas/Id'}
        opened_by: {$ref: '#/components/schemas/Id'}
        category: {$ref: '#/components/schemas/DisputeCategory'}
        statement: {type: string, maxLength: 2000}
        status: {$ref: '#/components/schemas/DisputeStatus'}
        outcome: {oneOf: [{$ref: '#/components/schemas/DisputeOutcome'}, {type: 'null'}]}
        reversal_amount_minor: {$ref: '#/components/schemas/Money'}
        reviewer_id: {oneOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        reason:
          type: string
          description: Reviewer rationale (empty until decided).
        opened_at: {$ref: '#/components/schemas/Timestamp'}
        decided_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    DisputeEvent:
      type: object
      required: [action, actor_id, occurred_at]
      additionalProperties: false
      properties:
        action: {type: string, description: "Event name, for example opened, under_review, resolved, withdrawn."}
        outcome: {$ref: '#/components/schemas/DisputeOutcome'}
        actor_id: {$ref: '#/components/schemas/Id'}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
    DisputeDetail:
      type: object
      required: [id, transaction_id, opened_by, category, statement, status, outcome, reversal_amount_minor, reviewer_id, reason, opened_at, decided_at, transaction, payer_display_name, payee_display_name, events]
      additionalProperties: false
      properties:
        <<: *disputeProps
        transaction: {$ref: '#/components/schemas/Transaction'}
        payer_display_name: {type: string}
        payee_display_name: {type: string}
        events:
          type: array
          items: {$ref: '#/components/schemas/DisputeEvent'}
    PolicyResponse:
      type: object
      required: [version, effective_at, policy]
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 0}
        effective_at:
          description: Set on PATCH responses; null on GET.
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        policy: {$ref: '#/components/schemas/Policy'}
    Policy:
      type: object
      required: [currency_name, decimals, default_credit_limit_minor, max_tx_amount_minor, proposal_expiry_days, dispute_window_days, join_mode, departure_rule, signup_grant_minor, limit_warning_days, default_flag_blocks_payer, directory_visibility]
      additionalProperties: false
      properties:
        currency_name: {type: string}
        decimals: {type: integer, minimum: 0}
        default_credit_limit_minor: {$ref: '#/components/schemas/Money'}
        max_tx_amount_minor: {$ref: '#/components/schemas/Money'}
        proposal_expiry_days: {type: integer, minimum: 0}
        dispute_window_days: {type: integer, minimum: 0}
        join_mode: {$ref: '#/components/schemas/JoinMode'}
        departure_rule: {$ref: '#/components/schemas/DepartureRule'}
        signup_grant_minor: {$ref: '#/components/schemas/Money'}
        limit_warning_days: {type: integer, minimum: 0}
        default_flag_blocks_payer: {type: boolean}
        directory_visibility: {type: string}
    PolicyPatch:
      type: object
      required: [reason]
      description: Partial Policy (RFC 7396). Unknown keys are 400 invalid-body; null values are 422. The reason key is required (non-empty) and is recorded on the audit event; it is not a policy field.
      additionalProperties: false
      properties:
        currency_name: {type: string}
        decimals: {type: integer, minimum: 0}
        default_credit_limit_minor: {$ref: '#/components/schemas/Money'}
        max_tx_amount_minor: {$ref: '#/components/schemas/MoneyPositive'}
        proposal_expiry_days: {type: integer, minimum: 0}
        dispute_window_days: {type: integer, minimum: 0}
        join_mode: {$ref: '#/components/schemas/JoinMode'}
        departure_rule: {$ref: '#/components/schemas/DepartureRule'}
        signup_grant_minor: {$ref: '#/components/schemas/Money'}
        limit_warning_days: {type: integer, minimum: 0}
        default_flag_blocks_payer: {type: boolean}
        directory_visibility: {type: string}
        reason: {type: string, maxLength: 500}
    AuditEvent:
      type: object
      required: [id, seq, occurred_at, actor_type, actor_id, action, target_type, target_id, request_id, reason, summary_before, summary_after, hash]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Id'}
        seq: {type: integer, format: int64}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        actor_type: {type: string}
        actor_id: {type: string}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        request_id: {type: string}
        reason: {type: string}
        summary_before: {description: "JSON object summary, or null when there is no state on that side.", oneOf: [{type: object}, {type: 'null'}]}
        summary_after: {description: "JSON object summary, or null when there is no state on that side.", oneOf: [{type: object}, {type: 'null'}]}
        hash: {type: string}
    ConsistencyCheck:
      type: object
      required: [id, status, ok, findings, ledger_seq, audit_events, created_at]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [complete]}
        ok: {type: boolean}
        findings: {type: array, items: {type: string}}
        ledger_seq: {type: integer, format: int64}
        audit_events: {type: integer, format: int64}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    Export:
      type: object
      required: [id, scope, format, status, created_at, expires_at, sha256, bytes, artefact_url, error]
      additionalProperties: false
      properties:
        id: {type: string, description: UUIDv4 as built.}
        scope: {type: string, enum: [mine, ledger, members, audit, full]}
        format: {type: string, enum: [csv, json]}
        status: {type: string, enum: [complete], description: "Only complete as built. Spec 065 also lists queued, running and failed (see spec 07 section 12)."}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        sha256: {oneOf: [{type: string, pattern: '^[0-9a-f]{64}$'}, {type: 'null'}]}
        bytes: {type: integer, minimum: 0}
        artefact_url: {oneOf: [{type: string}, {type: 'null'}]}
        error: {oneOf: [{type: string}, {type: 'null'}]}
    Token:
      type: object
      required: [id, name, scopes, network_id, created_at, last_used_at, expires_at, revoked_at]
      additionalProperties: false
      properties: &tokenProps
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [read, write]}
        network_id: {oneOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_used_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        expires_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        revoked_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    TokenCreated:
      type: object
      required: [id, name, scopes, network_id, created_at, last_used_at, expires_at, revoked_at, token]
      additionalProperties: false
      properties:
        <<: *tokenProps
        token:
          type: string
          description: The bearer token value (prefix cir_). Shown once; never returned again.
    InvitationCreated:
      type: object
      required: [id, token, expires_at, created_at]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Id'}
        token:
          type: string
          description: Invitation token, shown once. Stored hashed.
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    DepartureResult:
      type: object
      required: [member_id, status, settlement]
      additionalProperties: false
      properties:
        member_id: {$ref: '#/components/schemas/Id'}
        status: {$ref: '#/components/schemas/MemberStatus'}
        settlement: {type: string, enum: [retained, settled]}
        account: {$ref: '#/components/schemas/Account'}

    ReasonBody:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 500}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: {type: string}
        new_password: {type: string, description: Minimum length is a deployment setting (12 characters by default).}
    CreateListingRequest:
      type: object
      required: [kind, title]
      additionalProperties: false
      properties:
        kind: {$ref: '#/components/schemas/ListingKind'}
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 2000}
        price_minor:
          description: Optional. Omit or null for no price.
          oneOf: [{$ref: '#/components/schemas/MoneyPositive'}, {type: 'null'}]
    PatchListingRequest:
      type: object
      description: Merge patch. Only these keys; null is accepted only for price_minor (clears price).
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 2000}
        price_minor:
          oneOf: [{$ref: '#/components/schemas/MoneyPositive'}, {type: 'null'}]
        status: {$ref: '#/components/schemas/ListingStatus'}
    ProposeTransactionRequest:
      type: object
      required: [counterparty_member_id, direction, amount_minor]
      additionalProperties: false
      properties:
        counterparty_member_id: {$ref: '#/components/schemas/Id'}
        direction:
          type: string
          enum: [pay, receive]
          description: From the proposer's view. pay means the proposer is the payer.
        amount_minor: {$ref: '#/components/schemas/MoneyPositive'}
        listing_id: {$ref: '#/components/schemas/Id'}
        description: {type: string, maxLength: 500}
    OpenDisputeRequest:
      type: object
      required: [transaction_id, category, statement]
      additionalProperties: false
      properties:
        transaction_id: {$ref: '#/components/schemas/Id'}
        category: {$ref: '#/components/schemas/DisputeCategory'}
        statement: {type: string, minLength: 1, maxLength: 2000}
    ResolveDisputeRequest:
      type: object
      required: [outcome, reason]
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [no_action, dismissed, reversal, upheld, partially_upheld, adjustment]
          description: adjustment is accepted by the schema and returns 501 as built. no_action and dismissed are equivalent, and reversal and upheld are equivalent.
        reason: {type: string, minLength: 1, maxLength: 500}
        amount_minor:
          description: Required for partially_upheld (positive, not above the remaining reversible amount). For upheld it may be omitted or equal the remaining amount. Refused for dismissed.
          oneOf: [{$ref: '#/components/schemas/MoneyPositive'}, {type: 'null'}]
    ReversalRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        amount_minor:
          description: Omit for the full remaining amount.
          oneOf: [{$ref: '#/components/schemas/MoneyPositive'}, {type: 'null'}]
    AdjustmentRequest:
      type: object
      required: [member_id, direction, amount_minor, reason]
      additionalProperties: false
      properties:
        member_id: {$ref: '#/components/schemas/Id'}
        direction:
          type: string
          enum: [credit, debit]
          description: credit raises the member balance (system account down); debit lowers it.
        amount_minor: {$ref: '#/components/schemas/MoneyPositive'}
        reason: {type: string, minLength: 1, maxLength: 500}
    CreditLimitRequest:
      type: object
      required: [credit_limit_minor, reason]
      additionalProperties: false
      properties:
        credit_limit_minor:
          description: Required. A canonical string, or null to remove the override.
          oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
        reason: {type: string, minLength: 1, maxLength: 500}
        expires_at:
          description: Optional RFC 3339 expiry of the override.
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 7776000
          description: 0 selects the default of 7 days.
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, minLength: 1, maxLength: 80, description: Trimmed; no control characters.}
    CreateTokenRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        scopes:
          type: array
          minItems: 1
          items: {type: string, enum: [read, write, admin], description: admin returns 501 as built.}
        network_id: {$ref: '#/components/schemas/Id'}
        expires_at:
          description: RFC 3339, at most 365 days from now. Defaults to 365 days.
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
    CreateExportRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope: {type: string, enum: [mine, ledger, members, audit, full]}
        format: {type: string, enum: [json, csv], default: json}

    Page:
      type: object
      description: Cursor page envelope (API-034). data holds at most limit items.
      required: [data, next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null on the last page.
    MemberPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Member'}}
    AdminMemberPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/AdminMember'}}
    ListingPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Listing'}}
    TransactionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
    TransactionEventPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/TransactionEvent'}}
    DisputePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Dispute'}}
    EntryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Entry'}}
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
    TokenPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Token'}, maxItems: 100}
