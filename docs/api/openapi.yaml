        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XNetwork'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/PolicyPatch'}
      responses:
        '200':
          description: New policy version with effective_at.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
