    patch:
      operationId: patchPolicy
      tags: [Admin]
      summary: Create a new policy version (API-058)
      description: |
        Administrator only. Merge patch over the flat policy object (RFC 7396): null is refused
        (422). reason is required (422 validation-failed when empty) and recorded in the audit event. If-Match is required (428 when
