version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - nilerr
    - unconvert
    - gosec
    - depguard
  settings:
    depguard:
      # ARC-018: layering domain <- store <- service <- api/web is enforced here, not by convention.
      rules:
        domain:
          files: ["**/internal/domain/**", "!$test"]
          deny:
            - {pkg: github.com/djshellshoxxx/circula/internal/store, desc: domain must not depend on other layers}
            - {pkg: github.com/djshellshoxxx/circula/internal/service, desc: domain must not depend on other layers}
            - {pkg: github.com/djshellshoxxx/circula/internal/api, desc: domain must not depend on other layers}
            - {pkg: github.com/djshellshoxxx/circula/internal/web, desc: domain must not depend on other layers}
        store:
          files: ["**/internal/store/**", "!$test"]
          deny:
            - {pkg: github.com/djshellshoxxx/circula/internal/service, desc: store must not depend on service, api or web}
            - {pkg: github.com/djshellshoxxx/circula/internal/api, desc: store must not depend on service, api or web}
            - {pkg: github.com/djshellshoxxx/circula/internal/web, desc: store must not depend on service, api or web}
        service:
          files: ["**/internal/service/**", "!$test"]
          deny:
            - {pkg: github.com/djshellshoxxx/circula/internal/api, desc: service must not depend on the transport layers}
            - {pkg: github.com/djshellshoxxx/circula/internal/web, desc: service must not depend on the transport layers}
        # ARC-002: the HTML and JSON adapters reach state only through internal/service.
        adapters:
          files:
            - "**/internal/api/**"
            - "**/internal/web/**"
            - "!$test"
            # Documented exceptions, value types only: these files name store.Challenge,
            # store.DisputeResponse, store.ReReview*, store.Notification and store.Report,
            # which the service returns as-is. They read and write nothing. Remove each line
            # once those types move to internal/domain.
            - "!**/internal/api/h_closure.go"
            - "!**/internal/api/h_dispute_review.go"
            - "!**/internal/api/h_notify.go"
            - "!**/internal/api/h_reports.go"
            - "!**/internal/web/h_dispute_review.go"
          deny:
            - {pkg: github.com/djshellshoxxx/circula/internal/store, desc: adapters call internal/service only (ARC-002)}
            - {pkg: modernc.org/sqlite, desc: adapters call internal/service only (ARC-002)}
            - {pkg: database/sql, desc: adapters call internal/service only (ARC-002)}
        # ARC-002: operator tooling reads and writes through internal/service. Only the
        # composition root and the storage boundary may name the store package.
        cmd:
          files:
            - "**/cmd/**"
            - "!$test"
            - "!**/cmd/circula/schema.go"   # storage boundary: open and wire the store, schema inspection, raw handle for snapshots
            - "!**/cmd/circula/serve.go"    # composition root: store, audit sink and job runner wiring
            - "!**/cmd/circula/snapshot.go" # backup tooling; its store.ListNetworks call is to move to service.OperatorNetworks
          deny:
            - {pkg: github.com/djshellshoxxx/circula/internal/store, desc: "operator tooling goes through internal/service or the helpers in cmd/circula/schema.go (ARC-002)"}
            - {pkg: modernc.org/sqlite, desc: "operator tooling goes through internal/service or the helpers in cmd/circula/schema.go (ARC-002)"}
        # ARC-004: the repository contract suite is written against store.Store and store.Tx only.
        storetest:
          files: ["**/internal/storetest/**"]
          deny:
            - {pkg: modernc.org/sqlite, desc: the contract suite must not depend on a storage driver (ARC-004)}
            - {pkg: database/sql, desc: the contract suite must not depend on a storage driver (ARC-004)}
            - {pkg: github.com/djshellshoxxx/circula/internal/service, desc: the contract suite tests repositories, not services (ARC-004)}

    errcheck:
      # Best-effort operator output; a failed write to stdout or stderr has no recovery path.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # File paths come from operator configuration by design (backup, restore, config file).
        - G304
        - G306
        - G302
        - G301
        - G204
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
