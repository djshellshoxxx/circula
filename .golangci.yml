version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - nilerr
    - unconvert
    - gosec
  settings:
    errcheck:
      # Best-effort operator output; a failed write to stdout or stderr has no recovery path.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # File paths come from operator configuration by design (backup, restore, config file).
        - G304
        - G306
        - G302
        - G301
        - G204
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
