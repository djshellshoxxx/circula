{{define "content"}}
<p>{{.Text}}</p>
{{if eq .Status 500}}{{$reference := msgAround "error.reference"}}<p>{{$reference.Before}}<code>{{.ReqID}}</code>{{$reference.After}}</p>{{end}}
<div class="actions"><a class="btn" href="/">{{msg "error.return_home"}}</a>{{if eq .Status 403}} <a class="btn secondary" href="/login">{{msg "auth.title.sign_in"}}</a>{{end}}</div>
{{end}}
