{{define "content"}}
<form method="post" action="/join/{{.D.Token}}" novalidate>
  {{template "csrf" .}}
  {{template "field" dict "P" . "Name" "display_name" "Label" (msg "join.display_name.label") "Hint" (msg "join.display_name.hint") "Auto" "nickname" "Max" 60 "Req" true}}
  {{template "termsbox" .}}
  <p>{{msg "join.rules"}}</p>
  <div class="actions"><button type="submit">{{msg "join.invitation.submit"}}</button></div>
</form>
{{end}}
