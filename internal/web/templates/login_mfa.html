{{define "content"}}
<p>{{msg "auth.mfa_step.intro"}}</p>
<form method="post" action="/login/mfa" novalidate>
  {{template "csrf" .}}
  <input type="hidden" name="challenge" value="{{.D}}">
  <input type="hidden" name="next" value="{{.Next}}">
  {{template "field" dict "P" . "Name" "code" "Label" (msg "auth.label.signin_code") "Hint" (msg "auth.hint.signin_code") "Auto" "one-time-code" "Max" "16" "Req" true}}
  <div class="actions"><button type="submit">{{msg "auth.mfa_step.submit"}}</button></div>
</form>
<p><a href="/login{{if .Next}}?next={{.Next}}{{end}}">{{msg "auth.mfa_step.restart"}}</a></p>
{{end}}
